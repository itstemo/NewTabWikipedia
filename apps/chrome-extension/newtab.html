<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <button class="settings-toggle" id="settings-toggle" type="button"
          aria-expanded="false" aria-controls="settings-panel">
    <span aria-hidden="true">⚙</span> Settings
  </button>

  <main class="entry" id="entry" hidden>
    <header class="head">
      <p class="gloss" id="gloss"></p>
      <h1 class="headword"><a id="headword" href="#"></a></h1>
      <hr class="rule">
    </header>

    <div class="text">
      <p class="body" id="extract"></p>
      <p class="notice" id="notice" hidden></p>
      <nav class="actions">
        <a class="action" id="read" href="#">Read the full entry <span aria-hidden="true">&rarr;</span></a>
        <button class="action" id="another" type="button">Another entry <kbd>R</kbd></button>
      </nav>
    </div>

    <figure class="plate">
      <button class="plate-btn" id="plate-btn" type="button" hidden
              aria-label="View this plate at full size">
        <img id="plate-img" alt="">
      </button>
    </figure>
  </main>

  <dialog class="viewer" id="viewer">
    <img id="viewer-img" alt="">
  </dialog>

  <aside class="settings-panel" id="settings-panel" hidden aria-label="New tab settings">
    <form id="settings-form">
      <div class="settings-header">
        <div>
          <p class="panel-kicker">PERSONALIZE</p>
          <h2>New tab settings</h2>
        </div>
        <button class="panel-close" id="settings-close" type="button" aria-label="Close settings">&times;</button>
      </div>

      <fieldset class="topic-list">
        <legend>Choose sections</legend>
        <label class="all-option"><input type="checkbox" name="topic" value="all"> All sections <span>random</span></label>
        <p class="topic-subhead">CURATED</p>
        <label><input type="checkbox" name="topic" value="physics"> Physics</label>
        <label><input type="checkbox" name="topic" value="history"> History</label>
        <label><input type="checkbox" name="topic" value="mathematics"> Mathematics</label>
        <label><input type="checkbox" name="topic" value="technology"> Technology</label>
        <label><input type="checkbox" name="topic" value="geography"> Geography</label>
        <label><input type="checkbox" name="topic" value="art"> Art</label>
        <label><input type="checkbox" name="topic" value="music"> Music</label>
        <label><input type="checkbox" name="topic" value="literature"> Literature</label>
      </fieldset>

      <section class="more-categories">
        <button class="more-toggle" id="more-toggle" type="button" aria-expanded="false" aria-controls="more-categories-body">
          More sections <span aria-hidden="true">+</span>
        </button>
        <div id="more-categories-body" class="more-categories-body" hidden>
          <label class="category-search-label" for="category-search">Search Wikipedia categories</label>
          <input id="category-search" class="category-search" type="search" placeholder="e.g. archaeology" autocomplete="off">
          <p class="search-status" id="category-search-status" aria-live="polite"></p>
          <div class="category-results" aria-label="Category search results">
            <button class="category-result" data-slot="0" type="button" hidden></button>
            <button class="category-result" data-slot="1" type="button" hidden></button>
            <button class="category-result" data-slot="2" type="button" hidden></button>
            <button class="category-result" data-slot="3" type="button" hidden></button>
            <button class="category-result" data-slot="4" type="button" hidden></button>
            <button class="category-result" data-slot="5" type="button" hidden></button>
            <button class="category-result" data-slot="6" type="button" hidden></button>
            <button class="category-result" data-slot="7" type="button" hidden></button>
          </div>
          <p class="selected-label">SELECTED EXTRA SECTIONS</p>
          <div class="selected-categories" aria-label="Selected extra sections">
            <button class="selected-category" data-slot="0" type="button" hidden></button>
            <button class="selected-category" data-slot="1" type="button" hidden></button>
            <button class="selected-category" data-slot="2" type="button" hidden></button>
            <button class="selected-category" data-slot="3" type="button" hidden></button>
            <button class="selected-category" data-slot="4" type="button" hidden></button>
            <button class="selected-category" data-slot="5" type="button" hidden></button>
            <button class="selected-category" data-slot="6" type="button" hidden></button>
            <button class="selected-category" data-slot="7" type="button" hidden></button>
          </div>
        </div>
      </section>

      <section class="progress" aria-labelledby="progress-heading">
        <p class="panel-kicker" id="progress-heading">YOUR PROGRESS</p>
        <dl class="stats">
          <div><dt id="article-count">0</dt><dd>articles encountered</dd></div>
          <div><dt id="link-count">0</dt><dd>full entries opened</dd></div>
        </dl>
      </section>

      <button class="action panel-apply" type="submit">Apply section <span aria-hidden="true">&rarr;</span></button>
    </form>
  </aside>

  <aside class="index" id="index" aria-hidden="true">
    <span class="index-letter" id="index-letter"></span>
    <span class="index-number" id="index-number"></span>
  </aside>

  <script src="topics.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
