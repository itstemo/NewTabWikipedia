name: WikipediaNewTab
options:
  bundleIdPrefix: com.temo.wikipedia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  WikipediaNewTab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wikipedia New Tab
        CFBundleURLTypes:
          - CFBundleURLName: com.temo.wikipedia.newtab
            CFBundleURLSchemes: [wikipedia-newtab]
        LSRequiresIPhoneOS: true
        UIAppFonts:
          - Spectral-Light.ttf
          - Spectral-Regular.ttf
          - Spectral-Italic.ttf
          - Spectral-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
        UILaunchScreen:
          UIColorName: LaunchPaper
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/WikipediaNewTab.entitlements
      properties:
        com.apple.security.application-groups: [group.com.temo.wikipedia.newtab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.temo.wikipedia.newtab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
      - target: WikipediaWidget
        embed: true

  WikipediaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: Resources/Fonts
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Random Wikipedia
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Spectral-Light.ttf
          - Spectral-Regular.ttf
          - Spectral-Italic.ttf
          - Spectral-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    entitlements:
      path: Widget/WikipediaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.temo.wikipedia.newtab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.temo.wikipedia.newtab.widget
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
        SKIP_INSTALL: YES
